[metadata]
name = authentasdk
version = 1.1.0
description = Python SDK for the Authenta API to detect deepfakes and manipulated media
author = Authenta
author_email = admin@authenta.ai
url = https://github.com/praveen-benedict-authenta/authenta-python-sdk
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Operating System :: OS Independent

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
install_requires =
    requests>=2.20.0
    httpx>=0.23.0

[options.extras_require]
viz =
    opencv-python>=4.5
    Pillow>=8.0
pdf =
    pypdf>=3.0
all =
    opencv-python>=4.5
    Pillow>=8.0
    pypdf>=3.0

[options.packages.find]
where = src
